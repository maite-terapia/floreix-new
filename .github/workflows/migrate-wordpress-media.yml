name: Migrate WordPress images

on:
  push:
    paths:
      - '.github/workflows/migrate-wordpress-media.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-wordpress-media
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install photo processing dependencies
        run: python -m pip install --disable-pip-version-check 'requests>=2.31' 'Pillow>=10.2'
      - name: Compile and run the migration
        run: |
          python -m py_compile scripts/migrate-wordpress-media.py
          python scripts/migrate-wordpress-media.py
      - name: Commit imported photos and corrected image URLs
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/media assets/media-manifest.json index.html about contact metodologia privacy-policy psicoterapia terapia-a-la-natura es assets/premium.js
          if git diff --cached --quiet; then
            echo "No media changes."
          else
            git commit -m "feat(media): self-host optimized WordPress photography and update all image URLs"
            git pull --rebase origin main
            git push origin main
          fi
