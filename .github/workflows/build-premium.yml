name: build-premium-site

on:
  push:
    paths:
      - '.github/workflows/build-premium.yml'
      - 'assets/premium.css'
      - 'assets/premium-fixes.css'
      - 'assets/inner-pages.css'
      - 'assets/final-polish.css'
      - 'assets/navigation.css'
      - 'assets/premium.js'
      - 'assets/modern-v3.css'
      - 'assets/logo-floreix-nou.png'
      - 'assets/logo-floreix-nou-v2.png'
      - 'assets/maite-despacho.jpg'
      - 'assets/maite-despacho.webp'
      - 'assets/maite-sobre-nosotros.webp'
      - 'assets/logo-featf.jpg'
      - 'assets/logo-kine.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy exact content and photography from Floreix
        run: |
          set -e
          SRC='https://raw.githubusercontent.com/maite-terapia/floreix/main'
          files=(
            'index.html'
            'about/index.html'
            'contact/index.html'
            'metodologia/index.html'
            'privacy-policy/index.html'
            'psicoterapia/index.html'
            'terapia-a-la-natura/index.html'
            'es/index.html'
            'es/contacto/index.html'
            'es/metodologia/index.html'
            'es/psicoterapia/index.html'
            'es/sobre-nosotros/index.html'
            'es/terapia-en-la-naturaleza/index.html'
            'es/terminos-y-condiciones/index.html'
          )
          for f in "${files[@]}"; do
            mkdir -p "$(dirname "$f")"
            curl -fsSL "$SRC/$f" -o "$f"
            echo "Copied $f"
          done

          mkdir -p assets
          curl -A 'Mozilla/5.0' -fsSL --retry 2 'https://feap.es/images/logos/logo_FEATF_HZT.jpg' -o assets/logo-featf.jpg
          curl -A 'Mozilla/5.0' -fsSL --retry 2 'https://kine.org/images/logo_trama.jpg' -o assets/logo-kine.jpg
          echo 'Updated FEATF and KINE credential logos from official sources.'

      - name: Apply premium visual layer and new repository routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          old = 'https://maite-terapia.github.io/floreix/'
          new = 'https://maite-terapia.github.io/floreix-new/'

          files = [
            Path('index.html'), Path('about/index.html'), Path('contact/index.html'),
            Path('metodologia/index.html'), Path('privacy-policy/index.html'),
            Path('psicoterapia/index.html'), Path('terapia-a-la-natura/index.html'),
            Path('es/index.html'), Path('es/contacto/index.html'), Path('es/metodologia/index.html'),
            Path('es/psicoterapia/index.html'), Path('es/sobre-nosotros/index.html'),
            Path('es/terapia-en-la-naturaleza/index.html'), Path('es/terminos-y-condiciones/index.html')
          ]

          marker = '<meta name="theme-color" content="#17372f">'

          for path in files:
            html = path.read_text(encoding='utf-8')
            html = html.replace(old, new)
            html = html.replace('Static visual replica of floreix.com', 'Premium Floreix concept')
            if path.parts and path.parts[0] == 'es':
              html = html.replace('Inicioo', 'Inicio')

            for asset in ['premium.css','premium-fixes.css','inner-pages.css','final-polish.css','navigation.css','modern-v3.css']:
              html = re.sub(r'<link rel="stylesheet" href="[^"]*assets/' + re.escape(asset) + r'[^>]*>','',html)
            html = re.sub(r'<script src="[^"]*assets/premium\.js[^>]*></script>','',html)
            html = re.sub(r'<meta name="theme-color" content="#[0-9A-Fa-f]{6}">','',html)

            depth = len(path.parent.parts)
            prefix = '../' * depth

            # Bake the supplied Floreix PNG directly into both desktop and mobile headers.
            def replace_logo_tag(match):
              tag = match.group(0)
              tag = re.sub(r'\bsrc="[^"]*"', f'src="{prefix}assets/logo-floreix-nou-v2.png"', tag, count=1)
              tag = re.sub(r'\s+srcset="[^"]*"', '', tag)
              tag = re.sub(r'\s+sizes="[^"]*"', '', tag)
              tag = re.sub(r'\bwidth="[^"]*"', 'width="420"', tag)
              tag = re.sub(r'\bheight="[^"]*"', 'height="204"', tag)
              tag = re.sub(r'\balt="[^"]*"', 'alt="Floreix"', tag)
              return tag

            html = re.sub(
              r'<img\b(?=[^>]*class="[^"]*custom-logo[^"]*")[^>]*>',
              replace_logo_tag,
              html
            )

            css = f'<link rel="stylesheet" href="{prefix}assets/premium.css?v=23">'
            fixes = f'<link rel="stylesheet" href="{prefix}assets/premium-fixes.css?v=23">'
            inner = f'<link rel="stylesheet" href="{prefix}assets/inner-pages.css?v=23">'
            polish = f'<link rel="stylesheet" href="{prefix}assets/final-polish.css?v=23">'
            navigation = f'<link rel="stylesheet" href="{prefix}assets/navigation.css?v=23">'
            modern = f'<link rel="stylesheet" href="{prefix}assets/modern-v3.css?v=23">'
            js = f'<script src="{prefix}assets/premium.js?v=25" defer></script>'

            html = html.replace('</head>', f'{marker}\n{css}\n{fixes}\n{inner}\n{polish}\n{navigation}\n{modern}\n</head>', 1)
            html = html.replace('</body>', f'{js}\n</body>', 1)
            path.write_text(html, encoding='utf-8')

          Path('404.html').write_text('''<!doctype html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=./"><title>Floreix</title></head><body></body></html>''',encoding='utf-8')
          PY

      - name: Add Pages compatibility
        run: |
          touch .nojekyll
          cat > robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://maite-terapia.github.io/floreix-new/sitemap.xml
          EOF
          cat > sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/sitemap/0.9">
            <url><loc>https://maite-terapia.github.io/floreix-new/</loc></url>
            <url><loc>https://maite-terapia.github.io/floreix-new/psicoterapia/</loc></url>
            <url><loc>https://maite-terapia.github.io/floreix-new/terapia-a-la-natura/</loc></url>
            <url><loc>https://maite-terapia.github.io/floreix-new/about/</loc></url>
            <url><loc>https://maite-terapia.github.io/floreix-new/metodologia/</loc></url>
            <url><loc>https://maite-terapia.github.io/floreix-new/contact/</loc></url>
            <url><loc>https://maite-terapia.github.io/floreix-new/es/</loc></url>
          </urlset>
          EOF

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about contact metodologia privacy-policy psicoterapia terapia-a-la-natura es 404.html .nojekyll robots.txt sitemap.xml assets/logo-featf.jpg assets/logo-kine.jpg
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Generate premium Floreix website'
            git pull --rebase origin main
            git push origin main
          fi
