name: verify-premium

on:
  push:
    paths:
      - '.github/workflows/verify-premium.yml'
      - 'assets/premium.css'
      - 'assets/premium-fixes.css'
      - 'assets/navigation.css'
      - 'assets/premium.js'
      - 'index.html'
      - 'about/index.html'
      - 'es/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve, validate and capture
        run: |
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('shots',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const targets=[['home','http://127.0.0.1:8000/'],['about','http://127.0.0.1:8000/about/'],['es','http://127.0.0.1:8000/es/']];
          let failures=[];
          for (const [name,url] of targets){
            for (const [mode,w,h] of [['desktop',1440,1000],['mobile',390,844]]){
              const page=await browser.newPage({viewport:{width:w,height:h}});
              await page.goto(url,{waitUntil:'networkidle',timeout:120000});
              await page.evaluate(async()=>{if(document.fonts?.ready) await document.fonts.ready;});
              await page.waitForTimeout(500);
              const info=await page.evaluate(()=>{
                const hero=document.querySelector('main .elementor>.elementor-section:first-child,.entry-content>.elementor>.elementor-section:first-child');
                const heroBefore=hero?getComputedStyle(hero,'::before'):null;
                const logo=document.querySelector('header .custom-logo');
                const imgs=[...document.querySelectorAll('.elementor-widget-image img')];
                const credential=document.querySelector('.elementor-element[data-id="a5f07c6"] img');
                const desktopSub=document.querySelector('#ast-desktop-header .sub-menu');
                const mobileContent=document.querySelector('#ast-mobile-header .ast-mobile-header-content');
                return {
                  title:document.title,
                  premium:document.body.classList.contains('premium-site'),
                  css:[...document.styleSheets].some(s=>String(s.href||'').includes('premium.css')),
                  fixes:[...document.styleSheets].some(s=>String(s.href||'').includes('premium-fixes.css')),
                  nav:[...document.styleSheets].some(s=>String(s.href||'').includes('navigation.css')),
                  h1:document.querySelector('h1')?.innerText||'',
                  canonical:document.querySelector('link[rel="canonical"]')?.href||'',
                  heroOverlay:heroBefore?.content && heroBefore.content!=='none',
                  logoFilter:logo?getComputedStyle(logo).filter:'missing',
                  logoSrc:logo?.src||'',
                  filteredImages:imgs.filter(img=>getComputedStyle(img).filter!=='none').length,
                  credentialFilter:credential?getComputedStyle(credential).filter:'n/a',
                  desktopSubDisplay:desktopSub?getComputedStyle(desktopSub).display:'n/a',
                  mobileMenuDisplay:mobileContent?getComputedStyle(mobileContent).display:'n/a',
                  width:document.documentElement.scrollWidth,
                  viewport:window.innerWidth
                };
              });
              if(!info.premium||!info.css||!info.fixes||!info.nav) failures.push(`${name}-${mode}: premium layers missing`);
              if(info.heroOverlay) failures.push(`${name}-${mode}: hero overlay still present`);
              if(info.logoFilter!=='none') failures.push(`${name}-${mode}: logo filter=${info.logoFilter}`);
              if(info.filteredImages>0) failures.push(`${name}-${mode}: ${info.filteredImages} filtered images`);
              if(info.credentialFilter!=='n/a'&&info.credentialFilter!=='none') failures.push(`${name}-${mode}: credential logo filter=${info.credentialFilter}`);
              if(mode==='desktop'&&info.desktopSubDisplay!=='n/a'&&info.desktopSubDisplay!=='none') failures.push(`${name}-${mode}: submenu unexpectedly open`);
              if(mode==='mobile'&&info.mobileMenuDisplay!=='n/a'&&info.mobileMenuDisplay!=='none') failures.push(`${name}-${mode}: mobile menu unexpectedly open`);
              if(info.width>info.viewport+2) failures.push(`${name}-${mode}: horizontal overflow ${info.width}>${info.viewport}`);
              fs.appendFileSync('shots/report.txt',`${name} ${mode} ${JSON.stringify(info)}\n`);
              await page.screenshot({path:`shots/${name}-${mode}.png`,fullPage:true});
              await page.close();
            }
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-visual-verification
          path: shots/
