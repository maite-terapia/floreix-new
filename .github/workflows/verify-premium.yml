name: verify-premium

on:
  push:
    paths:
      - '.github/workflows/verify-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve and capture
        run: |
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('shots',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const targets=[['home','http://127.0.0.1:8000/'],['about','http://127.0.0.1:8000/about/'],['es','http://127.0.0.1:8000/es/']];
          for (const [name,url] of targets){
            for (const [mode,w,h] of [['desktop',1440,1000],['mobile',390,844]]){
              const page=await browser.newPage({viewport:{width:w,height:h}});
              await page.goto(url,{waitUntil:'networkidle',timeout:120000});
              await page.evaluate(async()=>{if(document.fonts?.ready) await document.fonts.ready;});
              await page.waitForTimeout(1200);
              const info=await page.evaluate(()=>({title:document.title,premium:document.body.classList.contains('premium-site'),h1:document.querySelector('h1')?.innerText||'',css:[...document.styleSheets].some(s=>String(s.href||'').includes('premium.css'))}));
              fs.appendFileSync('shots/report.txt',`${name} ${mode} ${JSON.stringify(info)}\n`);
              await page.screenshot({path:`shots/${name}-${mode}.png`,fullPage:true});
              await page.close();
            }
          }
          await browser.close();
          EOF
          node verify.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: premium-visual-verification
          path: shots/
