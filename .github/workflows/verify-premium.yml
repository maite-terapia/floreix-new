name: verify-premium

on:
  push:
    paths:
      - '.github/workflows/verify-premium.yml'
      - 'assets/premium.css'
      - 'assets/premium-fixes.css'
      - 'assets/inner-pages.css'
      - 'assets/final-polish.css'
      - 'assets/navigation.css'
      - 'assets/premium.js'
      - 'assets/modern-v3.css'
      - 'assets/logo-floreix-clean.png'
      - 'index.html'
      - 'about/index.html'
      - 'contact/index.html'
      - 'metodologia/index.html'
      - 'psicoterapia/index.html'
      - 'terapia-a-la-natura/index.html'
      - 'es/index.html'
      - 'es/contacto/index.html'
      - 'es/metodologia/index.html'
      - 'es/psicoterapia/index.html'
      - 'es/sobre-nosotros/index.html'
      - 'es/terapia-en-la-naturaleza/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Serve, validate and capture
        run: |
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          cat > verify.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'fs';
          fs.mkdirSync('shots',{recursive:true});
          const browser=await chromium.launch({headless:true});

          const routes=[
            ['home','/'],['about','/about/'],['contact','/contact/'],['metodologia','/metodologia/'],
            ['psicoterapia','/psicoterapia/'],['natura','/terapia-a-la-natura/'],['privacy','/privacy-policy/'],
            ['es','/es/'],['es-contacto','/es/contacto/'],['es-metodologia','/es/metodologia/'],
            ['es-psicoterapia','/es/psicoterapia/'],['es-about','/es/sobre-nosotros/'],
            ['es-natura','/es/terapia-en-la-naturaleza/'],['es-terms','/es/terminos-y-condiciones/']
          ];
          const heroPages=new Set(['home','about','contact','metodologia','psicoterapia','natura','es','es-contacto','es-metodologia','es-psicoterapia','es-about','es-natura']);
          const coreMobile=new Set(['home','about','psicoterapia','natura','es','es-about']);
          const screenshotNames=new Set(['home','about','psicoterapia','natura','es','es-about']);
          let failures=[];

          for (const [name,path] of routes){
            const modes=[['desktop',1440,1000]];
            if(coreMobile.has(name)) modes.push(['mobile',390,844]);
            for (const [mode,w,h] of modes){
              const page=await browser.newPage({viewport:{width:w,height:h}});
              await page.route('**/*', route => {
                const req=route.request();
                let host='';
                try{host=new URL(req.url()).hostname}catch{}
                if(host && host!=='127.0.0.1' && ['script','font','media','xhr','fetch'].includes(req.resourceType())) return route.abort();
                route.continue();
              });
              await page.goto(`http://127.0.0.1:8000${path}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1000);
              const info=await page.evaluate(()=>{
                const hero=document.querySelector('.elementor-element[data-id="1326b4b"],.elementor-element[data-id="7e3c9a4"],main .elementor>.elementor-section:first-child,.entry-content>.elementor>.elementor-section:first-child');
                const heroBefore=hero?getComputedStyle(hero,'::before'):null;
                const heroOverlay=hero?.querySelector(':scope > .elementor-background-overlay');
                const heroWrap=hero?.querySelector('.elementor-widget-wrap');
                const heroTitle=hero?.querySelector('h1,.elementor-element[data-id="0d2d40c"] .elementor-heading-title,.elementor-element[data-id="6dd604c"] .elementor-heading-title,.elementor-heading-title');
                const logo=document.querySelector('header .custom-logo');
                const footer=document.querySelector('#colophon.premium-footer');
                const serviceImg=document.querySelector('.elementor-element[data-id="7701125"] .elementor-widget-image img');
                const maiteImg=document.querySelector('.elementor-element[data-id="ec75349"] img');
                const copcImg=document.querySelector('.elementor-element[data-id="3935f1d"] img');
                const desktopSub=document.querySelector('#ast-desktop-header .sub-menu');
                const mobileContent=document.querySelector('#ast-mobile-header .ast-mobile-header-content');
                return {
                  premium:document.body.classList.contains('premium-site'),
                  css:[...document.styleSheets].some(s=>String(s.href||'').includes('premium.css')),
                  fixes:[...document.styleSheets].some(s=>String(s.href||'').includes('premium-fixes.css')),
                  inner:[...document.styleSheets].some(s=>String(s.href||'').includes('inner-pages.css')),
                  polish:[...document.styleSheets].some(s=>String(s.href||'').includes('final-polish.css')),
                  nav:[...document.styleSheets].some(s=>String(s.href||'').includes('navigation.css')),
                  modern:[...document.styleSheets].some(s=>String(s.href||'').includes('modern-v3.css')),
                  heroExists:!!hero,
                  headerWidth:document.querySelector('#masthead .ast-primary-header-bar')?.getBoundingClientRect().width||0,
                  heroWidth:hero?.getBoundingClientRect().width||0,
                  servicesWidth:document.querySelector('.elementor-element[data-id="7701125"]')?.getBoundingClientRect().width||0,
                  heroOverlayPseudo:!!(heroBefore?.content && heroBefore.content!=='none'),
                  heroOverlayElement:heroOverlay ? (getComputedStyle(heroOverlay).display!=='none' && parseFloat(getComputedStyle(heroOverlay).opacity||'1')>0.01) : false,
                  heroRadius:hero?parseFloat(getComputedStyle(hero).borderRadius):0,
                  heroHeight:hero?.getBoundingClientRect().height||0,
                  heroWrapBg:heroWrap?getComputedStyle(heroWrap).backgroundColor:'missing',
                  heroTextColor:heroTitle?getComputedStyle(heroTitle).color:'missing',
                  logoFilter:logo?getComputedStyle(logo).filter:'missing',
                  headerLogo:logo?.src||'',
                  footer:!!footer,
                  footerDisplay:footer?getComputedStyle(footer).display:'missing',
                  footerLogo:footer?.querySelector('img')?.src||'',
                  serviceRadius:serviceImg?parseFloat(getComputedStyle(serviceImg).borderRadius):null,
                  serviceHeight:serviceImg?.getBoundingClientRect().height||null,
                  serviceNumberVisible:document.querySelector('.floreix-service-card') ? getComputedStyle(document.querySelector('.floreix-service-card'),'::before').display!=='none' : false,
                  serviceTitleWidth:document.querySelector('.elementor-element[data-id="13ae7bf"]')?.getBoundingClientRect().width||null,
                  serviceRowWidth:document.querySelector('.elementor-element[data-id="ef970f2"]')?.getBoundingClientRect().width||null,
                  maiteLoaded:maiteImg ? (maiteImg.complete && maiteImg.naturalWidth>0) : null,
                  copcLoaded:copcImg ? (copcImg.complete && copcImg.naturalWidth>0) : null,
                  maiteSrc:maiteImg?.src||'',
                  credentialsCount:document.querySelector('.elementor-element[data-id="a5f07c6"] > .e-con-inner')?.children.length||0,
                  featfPresent:!!document.querySelector('.floreix-featf-credential'),
                  featfLogoLoaded:(()=>{const i=document.querySelector('.floreix-featf-logo');return i?i.complete&&i.naturalWidth>0:null})(),
                  kineLogoLoaded:(()=>{const i=document.querySelector('.floreix-kine-logo');return i?i.complete&&i.naturalWidth>0:null})(),
                  spanishInicioTypo:[...document.querySelectorAll('header a')].some(a=>a.textContent.trim().toLowerCase()==='inicioo'),
                  whatsappPresent:!!document.querySelector('.floreix-whatsapp[href="https://wa.me/34689056569"]'),
                  testimonialColor:(()=>{const e=document.querySelector('.elementor-element[data-id="d278a40"] p');return e?getComputedStyle(e).color:null})(),
                  kineVisibleText:(()=>{const e=document.querySelector('.floreix-degree-credential');return e?e.innerText.trim():null})(),
                  featfVisibleText:(()=>{const e=document.querySelector('.floreix-featf-credential');return e?e.innerText.trim():null})(),
                  maitePanelRadius:(()=>{const e=document.querySelector('.elementor-element[data-id="7326ae8"]');return e?parseFloat(getComputedStyle(e).borderRadius):null})(),
                  maitePhotoRadius:(()=>{const e=document.querySelector('.elementor-element[data-id="ec75349"] img');return e?parseFloat(getComputedStyle(e).borderRadius):null})(),
                  maiteColumnBg:(()=>{const e=document.querySelector('.elementor-element[data-id="5a72831"]');return e?getComputedStyle(e).backgroundImage:null})(),
                  maiteImageWidth:(()=>{const e=document.querySelector('.elementor-element[data-id="ec75349"] img');return e?e.getBoundingClientRect().width:null})(),
                  maiteColumnWidth:(()=>{const e=document.querySelector('.elementor-element[data-id="5a72831"]');return e?e.getBoundingClientRect().width:null})(),
                  desktopSubDisplay:desktopSub?getComputedStyle(desktopSub).display:'n/a',
                  mobileMenuDisplay:mobileContent?getComputedStyle(mobileContent).display:'n/a',
                  width:document.documentElement.scrollWidth,
                  viewport:window.innerWidth,
                  aboutIntro:!!document.querySelector('.floreix-about-intro'),
                  aboutPortrait:document.querySelector('.floreix-about-intro img')?.src||'',
                  aboutSourceHidden:document.querySelector('.elementor-element[data-id="bcb05fa"]')?.classList.contains('floreix-source-hidden')??null
                };
              });

              if(!info.premium||!info.css||!info.fixes||!info.inner||!info.polish||!info.nav||!info.modern) failures.push(`${name}-${mode}: visual layers missing`);
              if(heroPages.has(name)){
                if(!info.heroExists) failures.push(`${name}-${mode}: hero missing`);
                if(info.heroOverlayPseudo||info.heroOverlayElement) failures.push(`${name}-${mode}: hero overlay present`);
                if(info.heroRadius<18) failures.push(`${name}-${mode}: hero not rounded (${info.heroRadius})`);
                if(info.heroWrapBg!=='rgba(0, 0, 0, 0)' && info.heroWrapBg!=='transparent') failures.push(`${name}-${mode}: hero text has background ${info.heroWrapBg}`);
                if(info.heroTextColor!=='rgb(255, 255, 255)') failures.push(`${name}-${mode}: hero title is not white (${info.heroTextColor})`);
                if(mode==='desktop'&&info.heroHeight>525) failures.push(`${name}-${mode}: hero too tall (${info.heroHeight})`);
              }
              if(info.logoFilter!=='missing'&&info.logoFilter!=='none') failures.push(`${name}-${mode}: logo altered (${info.logoFilter})`);
              if(!info.whatsappPresent) failures.push(`${name}-${mode}: WhatsApp button missing or wrong number`);
              if(info.headerLogo && !info.headerLogo.includes('logo-floreix-clean.png')) failures.push(`${name}-${mode}: new header logo missing`);
              if(!info.footer||info.footerDisplay==='none') failures.push(`${name}-${mode}: footer missing`);
              if(!info.footerLogo.includes('logo-floreix-clean.png')) failures.push(`${name}-${mode}: new footer logo missing`);
              if(info.serviceRadius!==null&&info.serviceRadius<16) failures.push(`${name}-${mode}: service photo not rounded`);
              if(mode==='desktop'&&info.serviceHeight&&info.serviceHeight>380) failures.push(`${name}-${mode}: service photo too tall (${info.serviceHeight})`);
              if((name==='home'||name==='es')&&info.serviceNumberVisible) failures.push(`${name}-${mode}: service numbers still visible`);
              if((name==='home'||name==='es')&&info.serviceTitleWidth&&info.serviceRowWidth&&Math.abs(info.serviceTitleWidth-info.serviceRowWidth)>4) failures.push(`${name}-${mode}: services title is not aligned with cards`);
              if((name==='home'||name==='es')&&mode==='desktop'&&info.maiteLoaded===false) failures.push(`${name}: Maite image did not load`);
              if((name==='home'||name==='es')&&mode==='desktop'&&!info.maiteSrc.includes('maite-sobre-nosotros.webp')) failures.push(`${name}: office portrait missing from Maite section`);
              if((name==='home'||name==='es')&&mode==='desktop'&&(!info.featfPresent||info.credentialsCount<5)) failures.push(`${name}: credentials/FEATF block incomplete`);
              if((name==='home'||name==='es')&&info.testimonialColor!=='rgb(255, 255, 255)') failures.push(`${name}-${mode}: testimonial text lacks contrast (${info.testimonialColor})`);
              if((name==='home'||name==='es')&&mode==='desktop'&&((info.kineVisibleText||'').length>0 || (info.featfVisibleText||'').length>0)) failures.push(`${name}: KINE/FEATF cards should be logo-only`);
              if((name==='home'||name==='es')&&mode==='desktop'&&info.copcLoaded===false) failures.push(`${name}: COPC logo did not load`);
              if(mode==='desktop'&&info.desktopSubDisplay!=='n/a'&&info.desktopSubDisplay!=='none') failures.push(`${name}-${mode}: submenu unexpectedly open`);
              if(mode==='mobile'&&info.mobileMenuDisplay!=='n/a'&&info.mobileMenuDisplay!=='none') failures.push(`${name}-${mode}: mobile menu unexpectedly open`);
              if((name==='about'||name==='es-about')){
                if(!info.aboutIntro) failures.push(`${name}-${mode}: modern About intro missing`);
                if(!info.aboutPortrait.includes('maite-sobre-nosotros.webp')) failures.push(`${name}-${mode}: supplied office portrait missing`);
                if(info.aboutSourceHidden!==true) failures.push(`${name}-${mode}: old About intro still visible`);
              }
              if(heroPages.has(name) && info.headerWidth && info.heroWidth && Math.abs(info.headerWidth-info.heroWidth)>4) failures.push(`${name}-${mode}: header and hero widths differ ${info.headerWidth} vs ${info.heroWidth}`);
              if((name==='home'||name==='es') && info.servicesWidth && info.heroWidth && Math.abs(info.servicesWidth-info.heroWidth)>4) failures.push(`${name}-${mode}: home section width differs from hero`);
              if(name.startsWith('es') && info.spanishInicioTypo) failures.push(`${name}-${mode}: Inicioo typo still visible`);
              if((name==='home'||name==='es') && mode==='desktop' && (info.maitePanelRadius<20 || info.maitePhotoRadius<20)) failures.push(`${name}: Maite panel/photo corners are not rounded`);
              if((name==='home'||name==='es') && mode==='desktop' && info.maiteColumnBg && info.maiteColumnBg!=='none') failures.push(`${name}: legacy nature background still visible behind Maite portrait`);
              if((name==='home'||name==='es') && mode==='desktop' && info.maiteImageWidth && info.maiteColumnWidth && Math.abs(info.maiteImageWidth-info.maiteColumnWidth)>4) failures.push(`${name}: Maite portrait does not fill its column`);
              if((name==='home'||name==='es') && mode==='desktop' && (info.featfLogoLoaded===false || info.kineLogoLoaded===false)) failures.push(`${name}: FEATF or KINE logo failed to load`);
              if(info.width>info.viewport+2) failures.push(`${name}-${mode}: horizontal overflow ${info.width}>${info.viewport}`);

              fs.appendFileSync('shots/report.txt',`${name} ${mode} ${JSON.stringify(info)}\n`);
              if(screenshotNames.has(name)) await page.screenshot({path:`shots/${name}-${mode}.png`,fullPage:true});
              await page.close();
            }
          }
          await browser.close();
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          EOF
          node verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-visual-verification
          path: shots/
