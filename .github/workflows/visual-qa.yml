name: Audit image layout on desktop and mobile

on:
  push:
    paths:
      - '.github/workflows/visual-qa.yml'
      - 'scripts/visual-qa.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Check published images and responsive layouts
        run: node scripts/visual-qa.cjs
      - name: Save screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: floreix-visual-qa
          path: visual-qa-report/
          if-no-files-found: warn
